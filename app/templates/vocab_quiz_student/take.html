{% extends 'student_base.html' %}
{% block title %}어휘 연습 중{% endblock %}
{% block content %}
<div class="mb-4">
    <h2 class="font-black text-gray-800 text-lg">📖 어휘 연습 - {{ session.item_count }}문제</h2>
</div>
<div id="quiz-root"></div>
<button id="finish-btn" class="s-btn-primary w-full text-xl py-5 mt-2">
    ✅ 제출하고 결과 보기
</button>
<script>
const QUESTIONS = {{ questions | tojson }};
const SESSION_ID = "{{ session.id }}";
const ANSWER_URL = (id) => `/practice/vocab-quiz/session/${SESSION_ID}/answer`;
const COMPLETE_URL = `/practice/vocab-quiz/session/${SESSION_ID}/complete`;
const RESULT_URL = `/practice/vocab-quiz/session/${SESSION_ID}/result`;

function render() {
    const root = document.getElementById('quiz-root');
    root.innerHTML = QUESTIONS.map((q, i) => {
        const opts = (q.public_payload && q.public_payload.options) || [];
        const optHtml = opts.map((o, idx) => `
            <label class="flex items-center gap-3 px-4 py-3 rounded-2xl border-2 border-gray-200
                          cursor-pointer hover:border-indigo-400 hover:bg-indigo-50 transition mb-2
                          text-base text-gray-700 font-medium
                          ${q.selected_option === idx + 1 ? 'border-indigo-500 bg-indigo-50' : ''}">
                <input type="radio" name="q${i}" value="${idx + 1}" class="hidden"
                    ${q.selected_option === idx + 1 ? 'checked' : ''}
                    onchange="submitAnswer('${q.item_id}', ${idx + 1}, ${i})">
                <span class="w-8 h-8 rounded-full bg-indigo-100 text-indigo-600 flex items-center justify-center text-sm font-black shrink-0">
                    ${['①','②','③','④'][idx] || (idx + 1)}
                </span>
                ${o}
            </label>`).join('');
        const fb = q.is_correct === true ? '<span class="text-green-600 text-xs ml-2 font-bold">정답</span>'
                 : q.is_correct === false ? '<span class="text-red-500 text-xs ml-2 font-bold">오답</span>' : '';
        return `<div class="s-card p-5 mb-4">
            <div class="text-sm text-gray-400 mb-1">${i + 1}. ${q.lemma || ''}${fb}</div>
            <div class="text-gray-800 font-bold mb-3 leading-relaxed">${q.prompt}</div>
            ${optHtml}
        </div>`;
    }).join('');
}

async function submitAnswer(itemId, selected, idx) {
    const r = await fetch(ANSWER_URL(itemId), {
        method: 'POST', headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({item_id: itemId, selected_option: selected}),
    });
    const data = await r.json();
    QUESTIONS[idx].selected_option = selected;
    QUESTIONS[idx].is_correct = data.is_correct;
    render();
}

document.getElementById('finish-btn').addEventListener('click', async () => {
    await fetch(COMPLETE_URL, {method: 'POST'});
    window.location.href = RESULT_URL;
});

render();
</script>
{% endblock %}
